name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check acrux

      - name: Type check
        run: mypy acrux

      - name: Run tests
        run: pytest acrux/tests -v

  swift:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Swift app
        working-directory: swift_app/Acrux
        run: swift build -c release
